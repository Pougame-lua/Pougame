<!-- Este html es el feed -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PouGame - Feed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #11131a;
  color: #eee;
  font-family: Arial, sans-serif;
}

header {
  height: 65px;
  background: #1b1e29;
  border-bottom: 1px solid #303443;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #80aaff;
}

.logo span {
  color: white;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 7px;
  padding: 11px 17px;
  font-weight: bold;
  color: white;
  transition: .2s;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-1px);
}

.create {
  background: #3978e8;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

.hero {
  margin-bottom: 30px;
}

.hero h1 {
  font-size: 32px;
  margin: 0 0 10px;
}

.hero p {
  color: #9da8bd;
  margin: 0;
  line-height: 1.5;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 17px;
}

.section-title h2 {
  font-size: 19px;
  margin: 0;
}

.count {
  color: #91a6cb;
  font-size: 12px;
}

#games {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(245px,1fr));
  gap: 17px;
}

.game {
  background: #1b1e29;
  border: 1px solid #303443;
  border-radius: 11px;
  overflow: hidden;
  transition: .2s;
}

.game:hover {
  border-color: #668bd0;
  transform: translateY(-3px);
}

.game-cover {
  height: 145px;
  background: linear-gradient(135deg,#263c66,#172033);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.game-info {
  padding: 15px;
}

.game-name {
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.game-date {
  color: #929db1;
  font-size: 12px;
  margin-top: 7px;
}

.game-id {
  color: #68758d;
  font-size: 10px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.play {
  width: 100%;
  background: #287b50;
  margin-top: 14px;
  font-size: 13px;
}

.empty, .loading, .error {
  grid-column: 1/-1;
  text-align: center;
  padding: 55px 15px;
  background: #1b1e29;
  border: 1px solid #303443;
  border-radius: 10px;
  color: #aab5ca;
  line-height: 1.6;
}

.error {
  color: #ff8585;
}

.refresh {
  background: #292e3d;
  border: 1px solid #42495c;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #65718a;
  font-size: 12px;
  border-top: 1px solid #303443;
  margin-top: 50px;
}

@media(max-width:500px) {
  header {
    padding: 0 14px;
  }

  .logo {
    font-size: 19px;
  }

  main {
    padding: 25px 13px;
  }

  .hero h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🐾 Pou<span>Game</span></div>
  <button class="create" onclick="location.href='editor.html'">
    ＋ CREAR
  </button>
</header>

<main>

  <section class="hero">
    <h1>Explora PouGame 🎮</h1>
    <p>
      Descubre los proyectos creados con PouGame Studio.
      ¡Encuentra juegos nuevos y juega!
    </p>
  </section>

  <div class="section-title">
    <h2>🔥 Proyectos recientes</h2>
    <button class="refresh" onclick="loadGames()">
      ↻ Actualizar
    </button>
  </div>

  <div class="section-title">
    <span class="count" id="gameCount">Cargando proyectos...</span>
  </div>

  <section id="games">
    <div class="loading">🐾 Cargando proyectos...</div>
  </section>

</main>

<footer>
  🐾 PouGame · Crea, comparte y juega.
</footer>

<script>
const API = "/api/games";

const gamesContainer = document.getElementById("games");
const gameCount = document.getElementById("gameCount");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatDate(date) {
  if (!date) return "Fecha desconocida";

  const parsed = new Date(date);

  if (isNaN(parsed.getTime())) {
    return "Fecha desconocida";
  }

  return parsed.toLocaleString("es-MX", {
    dateStyle: "medium",
    timeStyle: "short"
  });
}

async function loadGames() {
  gamesContainer.innerHTML =
    '<div class="loading">🐾 Cargando proyectos...</div>';

  gameCount.textContent = "Actualizando...";

  try {
    const response = await fetch(API, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Error HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.games)) {
      throw new Error("Respuesta del servidor no válida.");
    }

    const games = data.games;

    gameCount.textContent =
      games.length + (games.length === 1
        ? " proyecto publicado"
        : " proyectos publicados");

    if (games.length === 0) {
      gamesContainer.innerHTML = `
        <div class="empty">
          <div style="font-size:45px">🎮</div>
          <h3>¡Todavía no hay juegos!</h3>
          <p>Sé el primero en publicar un proyecto.</p>
        </div>
      `;
      return;
    }

    gamesContainer.innerHTML = games.map(game => {
      const id = String(game.id || "");

      if (!/^[A-Za-z0-9_-]{8,20}$/.test(id)) {
        return "";
      }

      const name = escapeHTML(game.name || "MiJuego");
      const date = escapeHTML(formatDate(game.createdAt));

      const url = "play.html?id=" + encodeURIComponent(id);

      return `
        <article class="game">
          <div class="game-cover">🎮</div>

          <div class="game-info">
            <div class="game-name">${name}</div>

            <div class="game-date">
              📅 ${date}
            </div>

            <div class="game-id">
              ID: ${escapeHTML(id)}
            </div>

            <button
              class="play"
              onclick="location.href='${url}'">
              ▶ JUGAR
            </button>
          </div>
        </article>
      `;
    }).join("");

  } catch (error) {
    console.error(error);

    gameCount.textContent = "No se pudieron cargar los proyectos";

    gamesContainer.innerHTML = `
      <div class="error">
        <div style="font-size:40px">⚠️</div>
        <h3>Error al cargar PouGame Feed</h3>
        <p>${escapeHTML(error.message)}</p>
        <button class="refresh" onclick="loadGames()">
          Intentar nuevamente
        </button>
      </div>
    `;
  }
}

loadGames();
</script>

</body>
</html>
