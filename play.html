<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
  .back-button {
  background: #292e3d;
  color: #cbd7f0;
  border: 1px solid #42495c;
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

.back-button:hover {
  background: #35415a;
  border-color: #729cff;
  transform: translateY(-1px);
}
</style>
</head>
<body>
  <button class="back-button" onclick="location.href='https://pougame-oficial.netlify.app/'">
  ← Volver
</button>
<iframe id="game"></iframe>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

if (id && /^[A-Za-z0-9_-]{8,20}$/.test(id)) {
  document.getElementById("game").src =
    "/.netlify/functions/games?id=" + encodeURIComponent(id);
}
</script>
</body>
</html>
